services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: mydb_dev
    ports:
      - "5544:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data

  # --- Adminer (DB GUI) ---
  adminer:
    image: adminer:latest
    container_name: dev_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # --- ArangoDB ---
  arangodb:
    image: arangodb:3.12.1
    container_name: dev_arango
    restart: unless-stopped
    environment:
      ARANGO_ROOT_PASSWORD: dev
    ports:
      - "8530:8529"
    volumes:
      - arango_data_dev:/var/lib/arangodb3
      - arango_apps_dev:/var/lib/arangodb3-apps
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  pg_data_dev:
  arango_data_dev:
  arango_apps_dev:
