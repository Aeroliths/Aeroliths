services:
  app:
    container_name: ${NAME}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL}"
      ARANGO_URL: "${ARANGO_URL}"
      ARANGO_DB: "${ARANGO_DB}"
      ARANGO_USER: "${ARANGO_USER}"
      ARANGO_PASSWORD: "${ARANGO_PASSWORD}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN}"
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM}"
      APP_URL: "${APP_URL}"
      # Nuxt runtimeConfig override (needs NUXT_ prefix at runtime)
      NUXT_RESEND_API_KEY: "${RESEND_API_KEY}"
      NUXT_EMAIL_FROM: "${EMAIL_FROM}"
      NUXT_APP_URL: "${APP_URL}"
      NUXT_PUBLIC_HCAPTCHA_SITE_KEY: "${NUXT_PUBLIC_HCAPTCHA_SITE_KEY}"
      NUXT_HCAPTCHA_SECRET: "${NUXT_HCAPTCHA_SECRET}"
      POSTGRES_USER: "${POSTGRES_USER}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - arangodb
    networks:
      - web
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.${NAME}.entrypoints=websecure
      - traefik.http.services.${NAME}.loadbalancer.server.port=3000
      - traefik.http.routers.${NAME}.rule=Host(`aeroliths.fr`)
      - traefik.http.routers.${NAME}.tls=true
      - traefik.http.routers.${NAME}.tls.certresolver=myresolver

  # --- Service ArangoDB ---
  arangodb:
    image: arangodb:3.12.1
    container_name: ${PREFIX_NAME}_arango
    restart: always
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_PASSWORD}
    # Ports not exposed to host in production - accessible only via internal network
    # Uncomment below for local development access:
    # ports:
    #   - "${ARANGO_PORT}:8529"
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Service PostgreSQL ---
  postgres:
    image: postgres:15-alpine
    container_name: ${PREFIX_NAME}_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Port only accessible from internal Docker network (not exposed to host)
    # ports:
    #   - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  arango_data:
  arango_apps:
  pg_data:
  uploads_data:

